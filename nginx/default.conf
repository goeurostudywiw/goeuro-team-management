# Nginx Configuration for GOEURO Team Management on Public Web Host

upstream nextjs_upstream {
    server app:3005;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificates are installed)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Standalone HTTP proxy (active before SSL is provisioned)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Allow large consultation recording uploads (up to 100MB)
        client_max_body_size 100M;
    }
}

